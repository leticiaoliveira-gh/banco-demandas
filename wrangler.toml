# =====================================================================
#  CENTRAL DE DEMANDAS - configuracao do cofre na Cloudflare (Fase 1)
#
#  Este arquivo e so uma ETIQUETA: diz qual programa atende o site
#  (servidor/index.js), qual pasta e o site (esta aqui) e quais cofres
#  ele pode abrir. Nao roda nada sozinho e nao muda o site local:
#  o index.html continua abrindo com duplo clique, sem internet.
#
#  Os numeros "database_id" ficam em branco ate os cofres existirem.
#  Eles nascem com `npx wrangler d1 create <nome>`, que so pode rodar
#  depois da autorizacao de acesso (o unico momento da Le).
# =====================================================================

name = "conexaoempresas"
main = "servidor/index.js"
compatibility_date = "2026-09-19"

# ---------------------------------------------------------------------
#  O SITE
#  directory = "." -> a propria pasta do repositorio e o site.
#  O que NAO pode ir para o ar (dados reais, rascunhos, documentos de
#  trabalho) esta listado em .assetsignore, ao lado deste arquivo.
#  not_found_handling = "none" -> caminho que nao e arquivo cai no
#  programa, que e quem atende /api/.
# ---------------------------------------------------------------------
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "none"

# ---------------------------------------------------------------------
#  OS TRES COFRES
#  Separados de proposito: problema em um nao leva os outros junto.
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "central-demandas"
database_id = "279bda6d-31a1-4829-bf14-c8b9e7b2b7e8"

[[d1_databases]]
binding = "FOTOS"
database_name = "central-fotos"
database_id = "7265443c-94b1-4670-9929-cb521dbbd136"

[[d1_databases]]
binding = "COPIAS"
database_name = "central-copias"
database_id = "5a911a6a-4026-4e3b-8680-ee3d057359fa"

# ---------------------------------------------------------------------
#  OS COFRES DE ENSAIO (refeitos em 20/09)
#  Existem na conta, mas de proposito NAO entram como binding aqui: o
#  site publicado nunca deve enxergar o ensaio. Servem para testar
#  mudanca de banco antes de mexer no cofre de verdade, assim:
#
#     npx wrangler d1 execute central-demandas-ensaio --remote --file=<arquivo>.sql
#
#  Estrutura conferida em 20/09: identica a dos cofres de verdade.
#  Regra: nunca colocar dado real da Le neles.
#
#     central-demandas-ensaio  37d4e542-de2b-4ca6-b456-6a940eef31a2
#     central-fotos-ensaio     cb137aaf-7bce-4902-b7f8-3aa2bde42db6
#     central-copias-ensaio    84d7a983-90b0-4250-9a1a-80f42f9c3917
#
#  (Os cofres de ensaio anteriores foram apagados durante os testes de
#  20/09; estes sao os que os substituem.)
# ---------------------------------------------------------------------
#  SEGREDO
#  CHAVE_MESTRA cria a PRIMEIRA chave de acesso, uma vez so. Nunca fica
#  escrito neste arquivo (que vai para o GitHub). Entra por:
#     npx wrangler secret put CHAVE_MESTRA
# ---------------------------------------------------------------------
